name: crawl
on:
  workflow_dispatch:
    inputs:
      max_batches: { description: "batches per shard (keep small for first runs)", default: "1" }
  schedule:
    - cron: "17 21 */3 * *"  # every 3 days 02:47 IST; worker only claims portals that are due
concurrency: { group: crawl, cancel-in-progress: false }
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m jobcrawler.worker --shard ${{ matrix.shard }} --shards 4 --max-batches ${{ inputs.max_batches || 20 }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # repository secret, never committed
          CRAWLER_CONTACT: ${{ vars.CRAWLER_CONTACT }}
          CRAWLER_BATCH: ${{ vars.CRAWLER_BATCH }}
          CRAWLER_THREADS: ${{ vars.CRAWLER_THREADS }}

  health:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m jobcrawler.healthcheck --since-minutes 120 --baseline-bytes ${{ vars.CRAWLER_DB_BASELINE }} --gate   # fails the run on any anomaly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
