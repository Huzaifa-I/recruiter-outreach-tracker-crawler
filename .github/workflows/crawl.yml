name: crawl
on:
  workflow_dispatch:
    inputs:
      max_batches: { description: "batches per shard (keep small for first runs)", default: "1" }
  # Enable after the first manual run checks out (daily 02:47 IST; worker only claims portals that are due):
  # schedule:
  #   - cron: "17 21 * * *"
concurrency: { group: crawl, cancel-in-progress: false }
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m jobcrawler.worker --shard ${{ matrix.shard }} --shards 4 --max-batches ${{ inputs.max_batches || 20 }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # repository secret, never committed
          CRAWLER_CONTACT: ${{ vars.CRAWLER_CONTACT }}
